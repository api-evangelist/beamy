aid: beamy
name: Beamy
description: 'Beamy is an enterprise application-portfolio and usage-intelligence platform from Beamy
  SAS (Lille and Paris, France). It began as a SaaS discovery and governance product — browser-extension
  detection of shadow IT, SSO and ITSM integrations, spend and license tracking, security and compliance
  policy — and now positions itself as an AI-driven business transformation platform: modelling people,
  processes and applications from real usage signals so IT, finance and transformation leaders can rationalize
  their stack, negotiate renewals on actual consumption, and prioritize where to deploy AI. Sold to large
  enterprises (Veolia, Stellantis, Decathlon, Danske Bank, Equans) through a demo-request motion; its
  API sits behind a key-gated Kong gateway and its implementation documentation behind a lead form.'
