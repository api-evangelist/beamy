    - X-RateLimit-Remaining
    - X-RateLimit-Reset
    - RateLimit-Limit
    - RateLimit-Remaining
    - RateLimit-Reset
    - RateLimit-Policy
    - Retry-After
  note: >-
    None present. Full anonymous response header set on https://api.beamy.io/ is: date,
    content-type, www-authenticate, content-length, x-kong-response-latency, server,
    x-kong-request-id, via, alt-svc.

exhaustion_status_code: unknown
exhaustion_envelope: >-
  Kong's key-auth plugin answers { "message": "...", "request_id": "..." } on the observed 401; a
  429 from the same gateway would plausibly use the same envelope, but no 429 was induced and none
  is documented.

evidence:
