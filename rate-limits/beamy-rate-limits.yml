provider: Beamy
providerId: beamy
description: >-
  No Beamy rate limits are published, and no rate-limit signalling appears on any response an
  anonymous caller can obtain. The API edge is a Kong 3.9.3 gateway (server and x-kong-* headers)
  that refuses every request without a key, so whatever throttle it applies is invisible from
  outside.

